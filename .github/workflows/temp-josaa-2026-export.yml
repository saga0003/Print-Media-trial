name: Temporary JoSAA 2026 Round 5 PDF Export

on:
  pull_request:
    branches:
      - main
    paths:
      - tools/josaa_round5_official_export.py
      - .github/workflows/temp-josaa-2026-export.yml

permissions:
  contents: read

jobs:
  export-round5:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4 lxml pandas reportlab pypdf

      - name: Fetch official Round 5 data and generate PDF
        run: python tools/josaa_round5_official_export.py

      - name: Package results
        run: |
          pwd
          find . -maxdepth 4 -type f -printf '%p %s bytes\n'
          mkdir -p collected_round5
          find . -maxdepth 4 -type f \( -name 'JoSAA_2026_Round_5_OR_CR.pdf' -o -name 'JoSAA_2026_Round_5_OR_CR.csv' -o -name 'manifest.json' -o -name 'stage_summary.json' -o -name 'round5_result_response.html' \) -exec cp {} collected_round5/ \;
          echo 'Round 5 collection diagnostic' > collected_round5/RUN_MARKER.txt
          zip -j JoSAA_2026_Round_5_export.zip collected_round5/*

      - name: Upload Round 5 package
        uses: actions/upload-artifact@v4
        with:
          name: JoSAA_2026_Round_5_export_${{ github.run_number }}
          path: JoSAA_2026_Round_5_export.zip
          if-no-files-found: error
          retention-days: 1
